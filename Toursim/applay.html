<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha-job-portal</title>
</head>
<body>
    <header>
        <h1>Application Form</h1>
        <nav>
            <a href="index.html">Home</a><br><br>
            <a href="applay.html">click here</a><br><br>
            <a href="about.html">About us</a>
        </nav></header>
        <main>
            <form action="register" method="post">
                <label for="name">Full name</label>
                <input type="text" id="name" required><br><br>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required><br><br>
                <label for="tel">Phone Number</label>
                <input type="tel" id="tel" name="phone" requierd><br><br>
                <input type="radio" id="exp-1" name="Expriance">
               <label for="exp-1">0-1 years</label><br><br>
               <input type="radio" id="exp-2" name="Expriance">
                <label for="exp-2">1-3 years</label><br><br>
                <input type="radio" id="exp-3" name="Expriance">
                <label for="exp-3">3-5 years</label><br><br>
                <label for="postion">Postion</label>
                <select name="postion" id="postion">
                    <option value="">appplay for</option>
                    <option value="fullstack devloper">fullstack devloper</option>
                    <option value="Data analayis">Data analayis</option>
                    <option value="Qa engineer">Qa engineer</option>
                    <option value="Marketing">Marketing</option>
                </select>
                <br><br>
                <label>Skills</label><br><br>
                <label for="Html">Html</label>
                <input type="checkbox" id="Html"><br><br>
                <label for="git">Git</label>
                <input type="checkbox" id="git"><br><br>
                <label for="soft-skill">Problem skill</label>
                <input type="checkbox" id="soft-skill">
                <br><br>
                <label for="file">Upload a Resume/cv</label>
                <input type="file" id="file"><br><br>
                <label for="cover-letter">Cover letter</label>
                <textarea name="cover-letter" id="cover letter" minlength="100" maxlength="350" rows="15" cols="50" placeholder="write your bio and cover letter here"></textarea>
                <br><br>
                <button type="submit">Applay</button>
            </form>
        </main>
</body>
</html>
