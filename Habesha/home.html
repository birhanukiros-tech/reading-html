<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact-Habsha Eatery, Bole</title>
    <meta name="desicription" content="Get in touch with Habsha eatery in bole,Addis Ababa"
</head>
<body>
    <header>
        <h1>Contact Habesha Eatry</h1>
        <nav>
            <a href="index.html">Reservation</a>
            <a href="contact.html">contact</a>
        </nav>
    </header>
    <center>
        <h1>Addis Ababa Resturant</h1>
    </center>
    <main>
        <h2>Table Reservation</h2><br><br>
        <form action="/Reserve" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required><br><br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required><br><br>
            <label for="tel">Phone number</label>
            <input type="tel" id="tel" required><br><br>
            <label for="party-size">Number of Guests</label>
            <input type="number" id="party-size" name="Guests" min="1" max="=20" required><br><br>
            <label for="special-requistes">VIP</label>
            <textarea name="requusts" id="special-requistes" rows="3" cols="10" placeholder="wite your massage here..."></textarea><br><br>
            <button type="submit">Reserve</button>
        </form>
        <section>
            <h2>Addis Ababa Resturant Menu Tabel</h2>
            <table>
                <caption>Todays launch and dinner packages</caption>
                <tr>
                    <th>Food Item</th>
                    <th>Price (ETB)</th>
                    <th>Avaliabel Time</th>
                </tr>
                <tr>
                    <td>Special Kitfo</td> <td>300</td> <td>6:00-6:30</td>
                </tr>
                <tr>
                    <td>Fast Food</td> <td>200</td> <td>6:00-7:00</td>
                </tr>
                <tr>
                    <td>Shiro</td> <td>150</td> <td>7:00-8:00</td>
                </tr>
            </table>
        </section>
        
    </main>
    
</body>
</html>
